name: CI

on:
  push:
    # master 是实际在跑的分支（main 只是个旧名）。只挂 main 等于这些检查从来没跑过。
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # corepack 下载 pnpm 前会请求确认,CI 里无人应答。
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          # engines.node 要求 >=22;Node 25 起不再附带 corepack,升级时这一步要跟着改。
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (Node)
        run: pnpm run typecheck

      - name: Typecheck (browser)
        run: pnpm run typecheck:web

      - name: Tests (vitest)
        run: pnpm test

      # 仓库里还有一批 node:test 的 .mjs 行为测试（tests/*.test.mjs）。vitest 不认它们的
      # 写法，以前只有本机 `pnpm run test:mjs` 跑得到，CI 里等于没有。
      - name: Tests (node:test .mjs)
        run: pnpm run test:mjs

      - name: Build WebUI bundle
        run: pnpm run build:web

  templates:
    # 在仓库外装、类型检查、测试每个模板。cortico 直接装本次检出打的包:模板依赖的版本可能还没发到 npm,契约改动也与模板同步验证。
    name: extension templates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack the framework
        run: pnpm run publish:package --pack

      - name: Install, typecheck and test each template outside the repository
        run: |
          tarball="$(ls "$GITHUB_WORKSPACE"/dist/cortico-*.tgz)"
          for kind in world provider bot; do
            dir="$RUNNER_TEMP/template-$kind"
            cp -r "templates/extension/$kind" "$dir"
            (cd "$dir" && npm pkg set "devDependencies.cortico=file:$tarball" && pnpm install && pnpm typecheck && pnpm test)
          done
